name: exam_secret_codes
description: "تطبيق مستقل لإضافة بيانات الطلاب والأرقام السرية ورموز QR إلى أوراق الاختبارات PDF وWord."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fluent_editor:
    git:
      url: https://github.com/exusr/fluent-editor.git
  file_picker: ^8.0.0
  pdfx: ^2.6.0
  printing: ^5.13.0
  path_provider: ^2.1.2
  archive: ^3.6.1
  excel: ^4.0.6
  xml: 7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  xml: 7.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Amiri-Regular.ttf
