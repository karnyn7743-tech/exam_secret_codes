name: Initialize Project Structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Flutter base if missing
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            flutter create . --project-name exam_secret_codes
          fi

      - name: Create project folders
        run: |
          mkdir -p lib/models
          mkdir -p lib/services
          mkdir -p lib/screens
          mkdir -p lib/widgets
          mkdir -p assets/fonts
          mkdir -p assets/images

          touch lib/models/.gitkeep
          touch lib/services/.gitkeep
          touch lib/screens/.gitkeep
          touch lib/widgets/.gitkeep
          touch assets/fonts/.gitkeep
          touch assets/images/.gitkeep

      - name: Commit and push structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "chore: initialize Flutter project and folders structure"
            git push
          else
            echo "No changes to commit."
          fi
