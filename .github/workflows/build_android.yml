name: Build Exam Secret Codes APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tool/**'
      - '.github/workflows/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: exam-secret-codes-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build standalone Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.50.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Clean previous outputs
        run: flutter clean

      - name: Resolve standalone app dependencies
        run: flutter pub get

      - name: Apply Fluent Editor document interaction fixes
        run: dart run tool/patch_fluent_editor.dart

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: exam-secret-codes-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
